</style></head><body><div class="app"><header class="top"><div><div class="brand">FlowIQ Crew</div><div class="tagline">운영 확인 시스템</div></div><div class="icon-box">👑</div></header><main id="masterList"></main></div><script>
const APP_VERSION='v4.1.32 ARCHIVE LOCAL HIDE FIX';
const SUPABASE_URL='https://zhbzphvqiiijfjqnktlo.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpoYnpwaHZxaWlpamZqcW5rdGxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDEwNTcsImV4cCI6MjA5NDYxNzA1N30.ufIPHJh2fzRLm5taos3yTz6pGlEHFKaSoYI2Ref3T5I';
const SHEET_WEBHOOK_URL='https://script.google.com/macros/s/AKfycbx6bBKY4IxeCTCALRib22fFzYMQ7j5RwF3lK5g6a9Vref7WGNMQzSw-cCVt6BkzIB4/exec';

let jobs=[];

let liveTimer=null;

let masterAlertReady=false;
let pendingBaseline=new Set();
const openWorkerPanels=new Set();
const ARCHIVE_LOCAL_KEY='flowiq_master_archived_job_ids';
function getLocalArchivedIds(){try{return new Set(JSON.parse(localStorage.getItem(ARCHIVE_LOCAL_KEY)||'[]').map(String));}catch(e){return new Set();}}
function setLocalArchivedIds(set){try{localStorage.setItem(ARCHIVE_LOCAL_KEY,JSON.stringify([...set].map(String)));}catch(e){}}
function markLocalArchived(id){const s=getLocalArchivedIds();s.add(String(id));setLocalArchivedIds(s);}
function isLocalArchived(id){return getLocalArchivedIds().has(String(id));}
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clean=v=>String(v??'').trim();
const num=v=>Number(String(v??0).replace(/[^0-9.-]/g,''))||0;
const money=v=>num(v).toLocaleString('ko-KR')+'원';
try{document.title='FlowIQ Crew MASTER '+APP_VERSION;}catch(e){}
function normalizeText(v){return clean(v).replace(/\s+/g,'');}
function isArchiveMarked(j){const t=normalizeText(j?.type);return t.includes('[보관]')||t.includes('보관처리')||t.includes('보관됨')||t.includes('ARCHIVED');}
function isSheetSaved(j){return normalizeText(j?.type).includes('[시트저장]')||normalizeText(j?.type).includes('SHEETSAVED');}
function status(j){const t=normalizeText(j?.type);if(isArchiveMarked(j))return '보관';if(t.includes('공고마감')||t.includes('마감됨'))return '공고마감';if(t.includes('게시중'))return '게시중';return '게시대기';}
function cat(j){return clean(j?.type).replace(/\[[^\]]+\]/g,'').trim()||'공고';}
function pubType(j){return `[게시중] ${cat(j)}`;}
function closeType(j){const base=cat(j);const saved=isSheetSaved(j)?'[시트저장] ':'';return `${saved}[공고마감] ${base}`;}
function archiveType(j){let t=clean(j?.type)||cat(j);t=t.replace(/\[보관\]\s*/g,'').trim();return `[보관] ${t}`;}
function sheetSavedType(j){let t=clean(j?.type)||cat(j);return isSheetSaved(j)?t:`[시트저장] ${t}`;}
function workDays(start,end){const s=clean(start),e=clean(end||start);if(!s)return 1;const sd=new Date(s+'T00:00:00');const ed=new Date((e||s)+'T00:00:00');if(isNaN(sd)||isNaN(ed))return 1;return Math.max(1,Math.floor((ed-sd)/86400000)+1);}
function jobWorkDays(j){return workDays(j?.work_start_date||j?.work_start||j?.work_date,j?.work_end_date||j?.work_end||j?.work_start_date||j?.work_start||j?.work_date);}
function feeAmount(w,p,d=1){return Math.round(num(w)*num(p)*Math.max(1,num(d)||1)*0.05);}
function jobFeeAmount(j){return feeAmount(j?.salary,j?.needed,jobWorkDays(j));}
function dateText(j){const s=clean(j.work_start_date||j.work_start||j.work_date);const e=clean(j.work_end_date||j.work_end||s);if(!s)return '날짜 미정';return e&&e!==s?`${s} ~ ${e}`:s;}
function companyName(j){return clean(j.company_name)||clean(j.manager_name)||clean(j.company_id)||'업체 정보 없음';}
function managerName(j){return clean(j.company_manager)||clean(j.manager_name)||companyName(j)||'담당자 정보 없음';}
function managerPhone(j){return clean(j.company_phone)||clean(j.manager_contact)||clean(j.company_id)||'';}
function appPhone(a){return clean(a.phone||a.worker_phone||'');}
function appName(a){return clean(a.worker_name||a.name||'이름없음');}
function isMatched(s){return ['승인','근무완료'].includes(clean(s));}
function isRejected(s){return ['거절','신청반려','매칭취소'].includes(clean(s));}
function matchedAppsForJob(id){return applications.filter(a=>Number(a.job_id)===Number(id)&&isMatched(a.status));}
function countMatched(id){return matchedAppsForJob(id).length;}
function countPending(id){return applications.filter(a=>Number(a.job_id)===Number(id)&&clean(a.status)==='지원').length;}
function countDone(id){return applications.filter(a=>Number(a.job_id)===Number(id)&&clean(a.status)==='근무완료').length;}
function workerStats(phone){const p=String(phone??'').replace(/\D/g,'');const list=applications.filter(a=>String(a.phone??a.worker_phone??'').replace(/\D/g,'')===p);return {match:list.filter(a=>isMatched(a.status)).length,reject:list.filter(a=>isRejected(a.status)).length};}
function companyStats(companyId){const cid=String(companyId||'');const companyJobs=jobs.filter(j=>String(j.company_id||'')===cid);const jobIds=new Set(companyJobs.map(j=>Number(j.id)));const companyApps=applications.filter(a=>jobIds.has(Number(a.job_id))||String(a.company_id||'')===cid);const matchedJobIds=new Set(companyApps.filter(a=>isMatched(a.status)).map(a=>Number(a.job_id)));const completedJobIds=new Set(companyApps.filter(a=>clean(a.status)==='근무완료').map(a=>Number(a.job_id)));return {jobs:companyJobs.length,match:matchedJobIds.size,done:completedJobIds.size};}
function companyStatsLine(companyId){const s=companyStats(companyId);return `운영기록: 공고 ${s.jobs}회 · 매칭 ${s.match}회 · 완료 ${s.done}회`;}
function visibleJobs(){return jobs.filter(j=>!isArchiveMarked(j)&&!isLocalArchived(j.id));}
async function loadData(){
  const [j,a]=await Promise.all([
    db.from('jobs').select('*').order('id',{ascending:false}),
    db.from('applications').select('*').order('id',{ascending:false})
  ]);
  if(j.error)throw new Error('공고 조회 오류: '+j.error.message);
  if(a.error)throw new Error('지원자 조회 오류: '+a.error.message);
  jobs=j.data||[];
  applications=a.data||[];
}
async function approveJob(id){const j=jobs.find(x=>Number(x.id)===Number(id));if(!j)return alert('공고를 찾을 수 없습니다.');if(status(j)!=='게시대기')return alert('게시대기 공고만 승인할 수 있습니다.');const {error}=await db.from('jobs').update({type:pubType(j)}).eq('id',id);if(error)return alert('게시 승인 오류: '+error.message);toast('게시 승인 완료');await refresh();}
async function saveArchiveToSheet(id){
  const j=jobs.find(x=>Number(x.id)===Number(id));
  if(!j)return false;
  const related=applications.filter(a=>Number(a.job_id)===Number(id));
  const payload={
    type:'crew_archive',
    archivedAt:new Date().toLocaleString('ko-KR'),
    job:{
      id:j.id,company_id:j.company_id||'',company_name:companyName(j),company_manager:managerName(j),company_phone:managerPhone(j),title:j.title||'',status:status(j),work_date:j.work_date||j.work_start_date||j.work_start||'',work_start_date:j.work_start_date||j.work_start||'',work_time:j.work_time||'',location:j.location||'',needed:num(j.needed),matched_count:countMatched(j.id),done_count:countDone(j.id),pending_count:countPending(j.id),salary:num(j.salary),fee:jobFeeAmount(j),memo:'마스터 공고 마감/보관 저장'
    },
    workers:related.map(a=>({worker_name:appName(a),phone:appPhone(a),worker_phone:appPhone(a),status:clean(a.status),memo:''}))
  };
  try{
    await fetch(SHEET_WEBHOOK_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    return true;
  }catch(e){
    console.warn('sheet save failed',e);
    return false;
  }
}
async function closeJob(id){
  const j=jobs.find(x=>Number(x.id)===Number(id));
  if(!j)return alert('공고를 찾을 수 없습니다.');
  if(isArchiveMarked(j))return alert('보관 처리된 공고입니다.');
  if(status(j)==='공고마감')return alert('이미 마감된 공고입니다.');
  if(!confirm('이 공고를 마감할까요?\n\n마감 전 현재 기록을 Google Sheet에 저장합니다.'))return;
  let saved=true;
  if(!isSheetSaved(j)){
    saved=await saveArchiveToSheet(id);
    if(!saved && !confirm('시트 저장 요청 확인이 어렵습니다. 그래도 공고를 마감할까요?'))return;
  }
  const type=closeType({...j,type:sheetSavedType(j)});
  const {error}=await db.from('jobs').update({type}).eq('id',id);
  if(error)return alert('공고 마감 오류: '+error.message);
  toast(saved?'시트 저장 후 공고 마감 완료':'공고 마감 완료');
  await refresh();
}
async function archiveJob(id){
  const j=jobs.find(x=>Number(x.id)===Number(id));
  if(!j)return alert('공고를 찾을 수 없습니다.');
  if(isArchiveMarked(j)||isLocalArchived(id))return alert('이미 보관 처리된 공고입니다.');
  const title=clean(j.title)||`공고 #${id}`;
  if(!confirm(`이 공고를 보관 처리할까요?\n\n${title}\n\n공고와 신청 기록은 삭제되지 않습니다.\n보관 처리 후 마스터 목록에서는 즉시 보이지 않습니다.`))return;

  // 1) 화면에서는 먼저 숨긴다. Supabase 반영 지연/자동갱신과 관계없이 즉시 제거.
  markLocalArchived(id);
  jobs=jobs.filter(x=>Number(x.id)!==Number(id));
  openWorkerPanels.delete(String(id));
  render();

  // 2) 시트 저장은 버튼 클릭 시에만 시도한다.
  let saved=true;
  if(!isSheetSaved(j)){
    saved=await saveArchiveToSheet(id);
  }

  // 3) DB에는 삭제가 아니라 [보관] 상태만 저장한다.
  const finalType=archiveType({...j,type:sheetSavedType(j)});
  const {error}=await db.from('jobs').update({type:finalType}).eq('id',id);
  if(error){
    alert('보관 처리 DB 저장 오류: '+error.message+'\n\n화면에서는 임시로 숨겼지만, 새 기기에서는 다시 보일 수 있습니다.');
    return;
  }

  // 4) DB 반영 확인. 반영 지연이 있어도 로컬 숨김은 유지한다.
  try{
    const check=await db.from('jobs').select('id,type').eq('id',id).single();
    if(check && check.data && !isArchiveMarked(check.data)){
      console.warn('Archive type not reflected yet:', check.data);
    }
  }catch(e){console.warn('archive verify skipped',e);}

  toast(saved?'시트 저장 후 보관 처리 완료':'보관 처리 완료');
}
function toggleWorkerPanel(id){const key=String(id);if(openWorkerPanels.has(key))openWorkerPanels.delete(key);else openWorkerPanels.add(key);const el=$('masterWorkers_'+key);if(el)el.classList.toggle('hidden',!openWorkerPanels.has(key));}
function renderWorkers(id){const approved=matchedAppsForJob(id);if(!approved.length)return `<div class="empty" style="margin-top:10px">승인된 근로자가 없습니다.</div>`;return approved.map(a=>{const st=workerStats(appPhone(a));const appStatus=clean(a.status)||'승인';return `<div class="worker-card"><div class="worker-row"><div><div class="worker-name">${esc(appName(a))} <span class="worker-meta">· 매칭 ${st.match}회 · 거절 ${st.reject}회</span></div><div class="worker-meta">${esc(appPhone(a)||'번호없음')}</div></div><span class="status-pill status-ok">${esc(appStatus)}</span></div></div>`;}).join('');}
function card(j){
  const s=status(j);const matched=countMatched(j.id),pending=countPending(j.id),remain=Math.max(0,num(j.needed)-matched);const key=String(j.id);const panelClass=openWorkerPanels.has(key)?'worker-panel':'worker-panel hidden';
  let mainBtn='';
  if(s==='게시대기')mainBtn=`<button class="blue" onclick="approveJob(${Number(j.id)})">게시 승인</button>`;
  else if(s==='게시중')mainBtn=`<button class="red" onclick="closeJob(${Number(j.id)})">공고 마감</button>`;
  else mainBtn=`<button class="gray" disabled>마감됨</button>`;
  return `<div class="card" data-job-id="${Number(j.id)}"><div class="job-head"><div><div class="job-title">${esc(j.title)}</div><div class="type">${esc(cat(j))}</div></div><div class="badge">${esc(s)}</div></div>
  <div class="company-box"><div class="info">🏢 업체명: ${esc(companyName(j))}</div><div class="info">👤 담당자: ${esc(managerName(j))}</div>${managerPhone(j)?`<div class="info">📞 연락처: ${esc(managerPhone(j))}</div>`:''}<div class="info">📊 ${esc(companyStatsLine(j.company_id))}</div></div>
  <div class="info pay-line"><span class="emoji">📅</span><span>${esc(dateText(j))}</span></div>
  <div class="info pay-line"><span class="emoji">⏰</span><span>${esc(j.work_time||'-')}</span></div>
  <div class="info pay-line"><span class="emoji">📍</span><span>${esc(j.location||'-')}</span></div>
  <div class="info pay-line"><span class="emoji">👥</span><span>모집 ${num(j.needed)}명 · 매칭 ${matched}명 · 남은 ${remain}명 · 지원 ${pending}명</span></div>
  <div class="info pay-line"><span class="emoji">💰</span><span>일당 ${money(j.salary)} · 근무일수 ${jobWorkDays(j)}일</span></div>
  <div class="fee-account"><div class="info">🏦 FlowIQ Crew 수수료 입금 계좌</div><div class="info">은행: 등록 예정</div><div class="info">계좌번호: 등록 예정</div><div class="info">예금주: FlowIQ Crew</div></div>
  <div class="info pay-line"><span class="emoji">💸</span><span>플랫폼 수수료 ${money(jobFeeAmount(j))}</span></div>
  <div class="pay-note"><span class="mark">※</span><span>수수료 입금 확인 후 게시승인을 진행하세요.<br>근로자 임금은 업체가 직접 지급합니다.</span></div>
  <div class="master-action-row"><button class="outline" onclick="toggleWorkerPanel(${Number(j.id)})">승인 근로자 보기</button>${mainBtn}<button class="gray" onclick="archiveJob(${Number(j.id)})">보관 처리</button></div>
  <div id="masterWorkers_${Number(j.id)}" class="${panelClass}">${renderWorkers(j.id)}</div></div>`;
}
function render(){
  const root=$('masterList');if(!root)return;
  const list=visibleJobs();
  let html=`<div class="card notice"><div class="title">MASTER 운영</div><div class="sub">FlowIQ Crew는 플랫폼 수수료와 공고 상태를 확인합니다. 근로자 임금은 업체가 직접 지급합니다.</div><div class="sub" style="margin-top:8px">공고마감 상태는 보관 처리 전까지 목록에 남고, <b style="color:#dbeafe">[보관]</b> 처리된 공고만 숨김 처리됩니다.</div><div class="master-tools"><button class="outline" onclick="testAlert()">알림 테스트</button><button class="gray" onclick="refresh()">수동 동기화</button></div><div class="version" id="stamp">${APP_VERSION} · 시트 자동 저장</div></div>`;
  html+=list.length?list.map(j=>card(j)).join(''):`<div class="empty">표시할 공고가 없습니다.</div>`;
  html+=`<div class="ops-footer"><b>FlowIQ Crew 운영 고지</b><br>보관 처리된 공고는 목록에서 숨겨지지만 DB 기록과 누적 계산은 유지됩니다.</div>`;
  root.innerHTML=html;
}
function pendingJobKeys(){return new Set(visibleJobs().filter(j=>status(j)==='게시대기').map(j=>String(j.id)));}
async function refresh(){try{await loadData();render();const st=$('stamp');if(st)st.innerText='최근 동기화: '+new Date().toLocaleTimeString('ko-KR')+' · '+APP_VERSION;}catch(e){alert(e.message||e);}}
async function live(){if(busy)return;busy=true;try{const before=pendingBaseline;await loadData();const after=pendingJobKeys();const isNew=[...after].some(k=>!before.has(k));pendingBaseline=after;render();const st=$('stamp');if(st)st.innerText='최근 자동 동기화: '+new Date().toLocaleTimeString('ko-KR')+' · '+APP_VERSION;if(masterAlertReady&&isNew)notify('신규 공고가 등록되었습니다. 수수료 확인이 필요합니다.');}catch(e){console.warn(e);}finally{busy=false;}}
function toast(message){let el=$('fiqToast');if(!el){el=document.createElement('div');el.id='fiqToast';el.className='fiq-toast';document.body.appendChild(el);}el.textContent=message;el.classList.add('show');clearTimeout(window.__fiqToastTimer);window.__fiqToastTimer=setTimeout(()=>el.classList.remove('show'),3200);}
function notify(message){toast(message);playSound(false);}
function playSound(test=false){if(!alertEnabled&&!test)return;try{const Ctx=window.AudioContext||window.webkitAudioContext;const ctx=new Ctx();const now=ctx.currentTime;[0,0.18].forEach((d,i)=>{const o=ctx.createOscillator();const g=ctx.createGain();o.frequency.value=i?920:720;g.gain.setValueAtTime(0.001,now+d);g.gain.exponentialRampToValueAtTime(0.16,now+d+0.02);g.gain.exponentialRampToValueAtTime(0.001,now+d+0.16);o.connect(g);g.connect(ctx.destination);o.start(now+d);o.stop(now+d+0.18);});if(navigator.vibrate)navigator.vibrate([120,80,120]);if(test)toast('알림 테스트 완료');}catch(e){if(test)alert('브라우저가 소리를 막았습니다. 화면을 한 번 터치 후 다시 시도하세요.');}}
function testAlert(){masterAlertReady=true;playSound(true);}
document.addEventListener('click',()=>{masterAlertReady=true;},{passive:true});
async function init(){await refresh();pendingBaseline=pendingJobKeys();if(liveTimer)clearInterval(liveTimer);liveTimer=setInterval(live,1800);}document.addEventListener('visibilitychange',()=>{if(!document.hidden)live();});window.addEventListener('focus',live);init();
</script></body></html>
