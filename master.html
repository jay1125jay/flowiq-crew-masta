<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FlowIQ Crew MASTER v4.1 STABLE CORE</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#020617;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{display:flex;justify-content:center}.app{width:100%;max-width:440px;min-height:100vh;padding:24px 16px 80px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:30px;font-weight:950;letter-spacing:-1px;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 10px 28px rgba(96,165,250,.18)}.tagline{display:inline-flex;margin-top:6px;padding:6px 10px;border-radius:999px;background:rgba(37,99,235,.13);border:1px solid rgba(96,165,250,.22);color:#bfdbfe;font-size:12px;font-weight:800}.icon-box{width:48px;height:48px;border-radius:18px;background:rgba(37,99,235,.16);display:flex;align-items:center;justify-content:center;font-size:24px}.hidden{display:none!important}.card{background:linear-gradient(180deg,#0f172a,#111827);border:1px solid rgba(148,163,184,.14);border-radius:26px;padding:18px;margin-bottom:14px;box-shadow:0 12px 32px rgba(0,0,0,.28)}.notice{border-color:rgba(96,165,250,.22);background:linear-gradient(180deg,rgba(15,23,42,.98),rgba(30,41,59,.82))}.title{font-size:21px;font-weight:900;margin-bottom:6px}.sub{color:#94a3b8;font-size:14px;line-height:1.48}.section{font-size:21px;font-weight:950;margin:22px 0 12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}button{width:auto;border:1px solid rgba(148,163,184,.16);color:#fff;background:linear-gradient(180deg,#334155,#1e293b);border-radius:20px;min-height:52px;padding:0 14px;font-size:15px;font-weight:850;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.24)}button:active{transform:scale(.985)}button:disabled{opacity:.55;cursor:not-allowed}.full{width:100%;margin-top:10px}.big{width:100%;min-height:70px;margin-bottom:10px;font-size:17px}.blue{background:linear-gradient(135deg,#2563eb,#1d4ed8)}.green{background:linear-gradient(135deg,#059669,#047857)}.red{background:linear-gradient(135deg,#dc2626,#b91c1c)}.gray{background:linear-gradient(180deg,#475569,#1e293b)}input,select,textarea{width:100%;min-height:52px;margin:7px 0 13px;padding:0 14px;border-radius:16px;border:1px solid rgba(148,163,184,.18);background:#020617;color:#fff;font-size:15px;outline:none}textarea{min-height:90px;padding:14px;resize:vertical}label{display:block;color:#cbd5e1;font-size:13px;font-weight:750}.top-actions{display:flex;gap:8px;margin-bottom:12px}.top-actions button{flex:1;min-height:42px;border-radius:16px;font-size:12px}.job-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.job-title{font-size:20px;font-weight:950;line-height:1.28}.badge{display:inline-flex;align-items:center;justify-content:center;min-width:72px;height:38px;padding:0 12px;border-radius:16px;background:rgba(37,99,235,.18);color:#bfdbfe;border:1px solid rgba(96,165,250,.22);font-size:13px;font-weight:950}.type{display:inline-flex;margin-top:8px;padding:6px 10px;border-radius:999px;background:rgba(59,130,246,.14);color:#bfdbfe;font-size:12px;font-weight:850}.info{color:#cbd5e1;font-size:14px;margin:9px 0;line-height:1.45}.pay-line{display:flex;gap:8px;align-items:flex-start;color:#e2e8f0}.pay-line .emoji{width:22px;text-align:center;flex:0 0 22px}.pay-note{display:flex;gap:8px;margin-top:10px;padding:12px;border-radius:16px;background:rgba(59,130,246,.10);border:1px solid rgba(96,165,250,.16);color:#bfdbfe;font-size:12px;line-height:1.45}.pay-note .mark{width:18px;flex:0 0 18px}.count-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.count-tile{background:rgba(2,6,23,.54);border:1px solid rgba(148,163,184,.10);border-radius:16px;padding:12px 6px;text-align:center}.count-tile b{display:block;font-size:20px;margin-bottom:2px}.count-tile span{color:#94a3b8;font-size:11px}.worker-card{background:rgba(2,6,23,.58);border:1px solid rgba(148,163,184,.12);border-radius:18px;padding:13px;margin-top:10px}.worker-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.worker-name{font-size:16px;font-weight:900}.worker-meta{color:#94a3b8;font-size:12px;margin-top:4px}.status-pill{display:inline-flex;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:950}.status-wait{background:rgba(245,158,11,.16);color:#fde68a}.status-ok{background:rgba(16,185,129,.16);color:#86efac}.status-red{background:rgba(239,68,68,.16);color:#fecaca}.worker-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.worker-actions.one{grid-template-columns:1fr}.worker-actions button{min-height:44px;border-radius:15px;font-size:13px}details summary{list-style:none;cursor:pointer;background:linear-gradient(135deg,#2563eb,#1d4ed8);padding:14px;border-radius:18px;text-align:center;font-weight:950}details summary::-webkit-details-marker{display:none}.empty{border:1px dashed rgba(148,163,184,.25);border-radius:20px;padding:18px;color:#94a3b8;line-height:1.5}.alert-box{margin-top:10px;padding:11px;border-radius:16px;background:rgba(37,99,235,.14);border:1px solid rgba(96,165,250,.20);color:#dbeafe;font-size:13px;font-weight:850}.version{font-size:11px;color:#64748b;margin-top:6px}.company-box{background:rgba(15,23,42,.74);border:1px solid rgba(148,163,184,.12);border-radius:18px;padding:12px;margin:12px 0}.company-box .info{margin:5px 0}@media(max-width:390px){.count-grid{grid-template-columns:1fr 1fr}.worker-actions{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="top"><div><div class="brand">FlowIQ Crew</div><div class="tagline">MASTER Control</div></div><div class="icon-box">👑</div></header><main id="masterList"></main></div><script>
const APP_VERSION='v4.1 MASTER STABLE CORE';
const SUPABASE_URL='https://zhbzphvqiiijfjqnktlo.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6InpoYnpwaHZxaWlpamZqcW5rdGxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDEwNTcsImV4cCI6MjA5NDYxNzA1N30.ufIPHJh2fzRLm5taos3yTz6pGlEHFKaSoYI2Ref3T5I';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let jobs=[], applications=[], liveTimer=null, busy=false, alertEnabled=true, lastPendingJobs=new Set();
const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); const clean=v=>String(v??'').trim(); const num=v=>Number(String(v??0).replace(/[^0-9.-]/g,''))||0; const money=v=>num(v).toLocaleString('ko-KR')+'원';
function feeAmount(w,p){return Math.round(num(w)*num(p)*0.05);} function status(j){const t=clean(j?.type); if(t.includes('게시중'))return '게시중'; if(t.includes('공고마감'))return '공고마감'; return '게시대기';} function cat(j){return clean(j?.type).replace(/\[[^\]]+\]/g,'').trim()||'공고';} function pubType(j){return `[게시중] ${cat(j)}`;} function closeType(j){return `[공고마감] ${cat(j)}`;} function isMatched(s){return clean(s)==='승인';} function isRejected(s){return ['거절','매칭취소'].includes(clean(s));} function workerStats(phone){const p=String(phone??'').replace(/\D/g,''); const list=applications.filter(a=>String(a.phone??a.worker_phone??'').replace(/\D/g,'')===p); return {match:list.filter(a=>isMatched(a.status)).length,reject:list.filter(a=>isRejected(a.status)).length};}
function dateText(j){const s=clean(j.work_start_date||j.work_start||j.work_date); const e=clean(j.work_end_date||j.work_end||s); if(!s)return '날짜 미정'; return e&&e!==s?`${s} ~ ${e}`:s;} function companyName(j){return clean(j.company_name)||clean(j.manager_name)||clean(j.company_id)||'업체 정보 없음';} function managerName(j){return clean(j.company_manager)||clean(j.manager_name)||companyName(j);} function managerPhone(j){return clean(j.company_phone)||clean(j.manager_contact)||clean(j.company_id)||'';} function countMatched(id){return applications.filter(a=>Number(a.job_id)===Number(id)&&isMatched(a.status)).length;} function countPending(id){return applications.filter(a=>Number(a.job_id)===Number(id)&&clean(a.status)==='지원').length;}
async function loadData(){const [j,a]=await Promise.all([db.from('jobs').select('*').order('id',{ascending:false}),db.from('applications').select('*').order('id',{ascending:false})]); if(j.error)alert('공고 조회 오류: '+j.error.message); else jobs=j.data||[]; if(a.error)alert('지원자 조회 오류: '+a.error.message); else applications=a.data||[];}
async function approveJob(id){const j=jobs.find(x=>Number(x.id)===Number(id)); if(!j)return; const {error}=await db.from('jobs').update({type:pubType(j)}).eq('id',id); if(error)return alert('게시승인 오류: '+error.message); await refresh();}
async function closeJob(id){const j=jobs.find(x=>Number(x.id)===Number(id)); if(!j)return; if(!confirm('공고를 마감할까요?'))return; const {error}=await db.from('jobs').update({type:closeType(j)}).eq('id',id); if(error)return alert('마감 오류: '+error.message); await refresh();}
function render(){const root=$('masterList'); const openIds=new Set([...document.querySelectorAll('details[data-job-id][open]')].map(d=>d.dataset.jobId)); let html=`<div class="card notice"><div class="title">MASTER 운영</div><div class="sub">FlowIQ Crew는 플랫폼 수수료만 확인합니다. 근로자 임금은 업체가 직접 지급합니다.</div><label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" checked onchange="alertEnabled=this.checked" style="width:auto;min-height:auto;margin:0"> 신규 공고 알림 ON</label><button class="full gray" onclick="playSound(true)">알림 테스트</button><div class="version" id="stamp">v4.1 MASTER STABLE CORE</div></div>`; html+=jobs.length?jobs.map(j=>card(j)).join(''):`<div class="empty">공고가 없습니다.</div>`; root.innerHTML=html; openIds.forEach(id=>{const d=document.querySelector(`details[data-job-id="${id}"]`); if(d)d.open=true;});}
function card(j){const matched=countMatched(j.id), pending=countPending(j.id), remain=Math.max(0,num(j.needed)-matched); const approved=applications.filter(a=>Number(a.job_id)===Number(j.id)&&isMatched(a.status)); const rows=approved.length?approved.map(a=>{const st=workerStats(a.phone||a.worker_phone); return `<div class="worker-card"><div class="worker-row"><div><div class="worker-name">${esc(a.worker_name||'이름없음')} <span class="worker-meta">· 매칭 ${st.match}회 · 거절 ${st.reject}회</span></div><div class="worker-meta">${esc(a.phone||a.worker_phone||'번호없음')}</div></div><span class="status-pill status-ok">승인</span></div></div>`;}).join(''):`<div class="empty" style="margin-top:10px">승인된 근로자가 없습니다.</div>`; const s=status(j); let btn=s==='게시대기'?`<button class="full blue" onclick="approveJob(${Number(j.id)})">수수료 확인 / 게시승인</button>`:s==='게시중'?`<button class="full red" onclick="closeJob(${Number(j.id)})">공고마감</button>`:`<button class="full gray" disabled>마감됨</button>`; return `<div class="card"><div class="job-head"><div><div class="job-title">${esc(j.title)}</div><div class="type">${esc(cat(j))}</div></div><div class="badge">${s}</div></div><div class="company-box"><div class="info">🏢 업체명: ${esc(companyName(j))}</div><div class="info">👤 담당자: ${esc(managerName(j))}</div>${managerPhone(j)?`<div class="info">📞 연락처: ${esc(managerPhone(j))}</div>`:''}</div><div class="info pay-line"><span class="emoji">📅</span><span>${esc(dateText(j))}</span></div><div class="info pay-line"><span class="emoji">⏰</span><span>${esc(j.work_time||'-')}</span></div><div class="info pay-line"><span class="emoji">📍</span><span>${esc(j.location||'-')}</span></div><div class="info pay-line"><span class="emoji">👥</span><span>모집 ${num(j.needed)}명 · 매칭 ${matched}명 · 남은 ${remain}명 · 지원 ${pending}명</span></div><div class="info pay-line"><span class="emoji">💰</span><span>일당 ${money(j.salary)}</span></div><div class="info pay-line"><span class="emoji">💸</span><span>플랫폼 수수료 ${money(feeAmount(j.salary,j.needed))}</span></div><div class="pay-note"><span class="mark">※</span><span>FlowIQ Crew는 플랫폼 수수료만 확인합니다. 근로자 임금은 업체가 직접 지급합니다.</span></div>${btn}<details data-job-id="${Number(j.id)}" style="margin-top:10px"><summary>승인 근로자 보기</summary>${rows}</details></div>`;}
function pendingJobKeys(){return new Set(jobs.filter(j=>status(j)==='게시대기').map(j=>String(j.id)));} async function refresh(){await loadData(); render();} async function live(){if(busy)return; busy=true; const before=lastPendingJobs; try{await loadData(); const after=pendingJobKeys(); const isNew=[...after].some(k=>!before.has(k)); lastPendingJobs=after; render(); const st=$('stamp'); if(st)st.innerText='최근 자동 동기화: '+new Date().toLocaleTimeString('ko-KR'); if(isNew&&before.size>0)playSound(false);}finally{busy=false;}}
function playSound(test=false){if(!alertEnabled&&!test)return; try{const ctx=new (window.AudioContext||window.webkitAudioContext)(); const now=ctx.currentTime; [0,0.18].forEach((d,i)=>{const o=ctx.createOscillator(); const g=ctx.createGain(); o.frequency.value=i?900:700; g.gain.setValueAtTime(0.001,now+d); g.gain.exponentialRampToValueAtTime(0.16,now+d+0.02); g.gain.exponentialRampToValueAtTime(0.001,now+d+0.16); o.connect(g); g.connect(ctx.destination); o.start(now+d); o.stop(now+d+0.18);}); if(navigator.vibrate)navigator.vibrate([120,80,120]); if(test)alert('알림 테스트 완료');}catch(e){if(test)alert('브라우저가 소리를 막았습니다. 화면을 한 번 터치 후 다시 시도하세요.');}}
async function init(){await refresh(); lastPendingJobs=pendingJobKeys(); liveTimer=setInterval(live,1800);} document.addEventListener('visibilitychange',()=>{if(!document.hidden)live();}); window.addEventListener('focus',live);

init();</script></body></html>
