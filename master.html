button{

  overflow:hidden;
  isolation:isolate;
  border:1px solid rgba(37,99,255,.38) !important;

    linear-gradient(180deg,rgba(13,17,32,.92),rgba(4,9,22,.96)) !important;

    0 0 0 1px rgba(255,255,255,.035) inset,
    0 10px 26px rgba(0,0,0,.34),
    0 0 22px rgba(37,99,255,.10) !important;
  transition:transform .14s ease, border-color .14s ease, box-shadow .14s ease, filter .14s ease;
}
button::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;

    linear-gradient(100deg,rgba(37,99,255,.34),rgba(0,212,200,.20),rgba(123,97,255,.18));
  opacity:.18;
  transition:opacity .14s ease;
}

  opacity:.88;
}

  filter:brightness(1.08) !important;
  border-color:rgba(0,212,200,.72) !important;

    0 0 0 1px rgba(0,212,200,.13) inset,
    0 14px 34px rgba(0,0,0,.42),
    0 0 28px rgba(37,99,255,.24),
    0 0 18px rgba(0,212,200,.10) !important;
}

button:disabled{opacity:.46 !important; filter:saturate(.55) brightness(.75) !important; box-shadow:none !important}

/* ===== WEXA v4.1.52 CLEAN FINAL TRUE SPLIT BUTTON LAYOUT =====
   구조 고정: 아이콘은 버튼 위쪽 중앙 / 글자는 버튼 아래쪽 중앙.
   기존 pseudo-icon 패치와 충돌하지 않도록 ::before/::after를 완전 비활성화하고
   실제 span 아이콘/라벨만 사용한다.
*/
.master-action-row{
  display:grid !important;
  grid-template-columns:repeat(3,minmax(0,1fr)) !important;
  gap:10px !important;
  margin-top:14px !important;
}

  min-height:108px !important;

  overflow:hidden !important;
  display:block !important;
  text-align:center !important;
  color:#f8fbff !important;
  background:
    radial-gradient(circle at 50% 20%, rgba(37,99,255,.16), transparent 44%),
    linear-gradient(180deg, rgba(6,16,40,.98), rgba(2,8,23,.99)) !important;
  border:1px solid rgba(0,132,255,.66) !important;
  box-shadow:
    inset 0 0 18px rgba(37,99,255,.14),

    0 0 14px rgba(0,132,255,.32),
    0 0 28px rgba(47,128,255,.16) !important;
}
.master-action-row button.wexa-action-btn::before,
.master-action-row button.wexa-action-btn::after{
  content:none !important;
  display:none !important;
  width:0 !important;
  height:0 !important;
  background:none !important;
}
.wexa-action-icon{
  position:absolute !important;

  left:50% !important;

  width:50px !important;
  height:50px !important;
  display:block !important;
  background-repeat:no-repeat !important;
  background-position:center !important;
  background-size:50px 50px !important;

    drop-shadow(0 0 4px rgba(47,128,255,.55))

function getLocalArchivedIds(){try{return new Set(JSON.parse(localStorage.getItem(ARCHIVE_LOCAL_KEY)||'[]').map(String));}catch(e){return new Set();}}
function setLocalArchivedIds(set){try{localStorage.setItem(ARCHIVE_LOCAL_KEY,JSON.stringify([...set].map(String)));}catch(e){}}
function markLocalArchived(id){const s=getLocalArchivedIds();s.add(String(id));setLocalArchivedIds(s);}

function normalizeText(v){return clean(v).replace(/\s+/g,'');}
function isArchiveMarked(j){
  const raw=clean(j?.type||'');
  const t=normalizeText(raw).toLowerCase();
  // 기존 버전들에서 보관 표기가 [보관], 보관 처리, 보관됨, ARCHIVE 등으로 섞였기 때문에
  // 마스터 목록에서는 '보관' 의미가 들어간 모든 상태를 숨김 대상으로 본다.
  if(j?.archived===true || j?.is_archived===true || j?.master_hidden===true)return true;
  return t.includes('보관') || t.includes('archive') || t.includes('archived') || t.includes('[hidden]');
}
function isSheetSaved(j){return normalizeText(j?.type).includes('[시트저장]')||normalizeText(j?.type).includes('SHEETSAVED');}
function status(j){const t=normalizeText(j?.type);if(isArchiveMarked(j))return '보관';if(t.includes('공고마감')||t.includes('마감됨'))return '공고마감';if(t.includes('게시중'))return '게시중';return '게시대기';}
function cat(j){return clean(j?.type).replace(/\[[^\]]+\]/g,'').trim()||'공고';}
function pubType(j){return `[게시중] ${cat(j)}`;}
function closeType(j){const base=cat(j);const saved=isSheetSaved(j)?'[시트저장] ':'';return `${saved}[공고마감] ${base}`;}
function archiveType(j){
  let t=clean(j?.type)||cat(j);
  t=t
    .replace(/\[보관\]\s*/g,'')
    .replace(/보관\s*처리/g,'')
    .replace(/보관됨/g,'')
    .replace(/archived?/ig,'')
    .trim();
  return `[보관] ${t}`;
}
function sheetSavedType(j){let t=clean(j?.type)||cat(j);return isSheetSaved(j)?t:`[시트저장] ${t}`;}
function workDays(start,end){const s=clean(start),e=clean(end||start);if(!s)return 1;const sd=new Date(s+'T00:00:00');const ed=new Date((e||s)+'T00:00:00');if(isNaN(sd)||isNaN(ed))return 1;return Math.max(1,Math.floor((ed-sd)/86400000)+1);}
function jobWorkDays(j){return workDays(j?.work_start_date||j?.work_start||j?.work_date,j?.work_end_date||j?.work_end||j?.work_start_date||j?.work_start||j?.work_date);}
function feeAmount(w,p,d=1){return Math.round(num(w)*num(p)*Math.max(1,num(d)||1)*0.05);}
function jobFeeAmount(j){return feeAmount(j?.salary,j?.needed,jobWorkDays(j));}
function dateText(j){const s=clean(j.work_start_date||j.work_start||j.work_date);const e=clean(j.work_end_date||j.work_end||s);if(!s)return '날짜 미정';return e&&e!==s?`${s} ~ ${e}`:s;}
function companyName(j){return clean(j.company_name)||clean(j.manager_name)||clean(j.company_id)||'업체 정보 없음';}

function appPhone(a){return clean(a.phone||a.worker_phone||'');}
function appName(a){return clean(a.worker_name||a.name||'이름없음');}
function isMatched(s){return ['승인','근무완료'].includes(clean(s));}
function isRejected(s){return ['거절','신청반려','매칭취소'].includes(clean(s));}

function countPending(id){return applications.filter(a=>Number(a.job_id)===Number(id)&&clean(a.status)==='지원').length;}
function countDone(id){return applications.filter(a=>Number(a.job_id)===Number(id)&&clean(a.status)==='근무완료').length;}
function workerStats(phone){const p=String(phone??'').replace(/\D/g,'');const list=applications.filter(a=>String(a.phone??a.worker_phone??'').replace(/\D/g,'')===p);return {match:list.filter(a=>isMatched(a.status)).length,reject:list.filter(a=>isRejected(a.status)).length};}
function companyStats(companyId){const cid=String(companyId||'');const companyJobs=jobs.filter(j=>String(j.company_id||'')===cid);const jobIds=new Set(companyJobs.map(j=>Number(j.id)));const companyApps=applications.filter(a=>jobIds.has(Number(a.job_id))||String(a.company_id||'')===cid);const matchedJobIds=new Set(companyApps.filter(a=>isMatched(a.status)).map(a=>Number(a.job_id)));const completedJobIds=new Set(companyApps.filter(a=>clean(a.status)==='근무완료').map(a=>Number(a.job_id)));return {jobs:companyJobs.length,match:matchedJobIds.size,done:completedJobIds.size};}

async function loadData(){
  const [j,a]=await Promise.all([
    db.from('jobs').select('*').order('id',{ascending:false}),
    db.from('applications').select('*').order('id',{ascending:false})
  ]);

  if(a.error)throw new Error('지원자 조회 오류: '+a.error.message);

  applications=a.data||[];
}

async function saveArchiveToSheet(id){

    type:'crew_archive',
    archivedAt:new Date().toLocaleString('ko-KR'),

  try{

    return true;
  }catch(e){

  }
}
async function closeJob(id){
  const j=jobs.find(x=>Number(x.id)===Number(id));

  if(isArchiveMarked(j))return alert('보관 처리된 공고입니다.');
  if(status(j)==='공고마감')return alert('이미 마감된 공고입니다.');
  if(!confirm('이 공고를 마감할까요?\n\n마감 전 현재 기록을 Google Sheet에 저장합니다.'))return;

    saved=await saveArchiveToSheet(id);

async function archiveJob(id){
  const j=jobs.find(x=>Number(x.id)===Number(id));

  if(isArchiveMarked(j)||isLocalArchived(id))return alert('이미 보관 처리된 공고입니다.');
  const title=clean(j.title)||`공고 #${id}`;
  if(!confirm(`이 공고를 보관 처리할까요?\n\n${title}\n\n공고와 신청 기록은 삭제되지 않습니다.\n시트 저장 후 마스터 목록에서는 즉시 보이지 않습니다.`))return;

  // 1) 시트 저장을 먼저 시도한다. 여기서 먼저 목록에서 빼면 saveArchiveToSheet가 공고를 못 찾아 저장이 안 된다.

async function deleteJobHard(id){

    });

    if (!token) {
      wexaToast("푸시 실패: FCM 토큰이 발급되지 않았습니다.");
      return;
    }

    await saveMasterFcmToken(token);
    try { localStorage.setItem("wexa_master_fcm_ready", "1"); } catch(e) {}
    wexaToast("마스터 알림 준비 완료 · 토큰 저장 OK");
  }catch(err){
    const message = err && err.message ? err.message : String(err);
    console.error("MASTER FCM 준비 오류", err);
    wexaToast("마스터 알림 준비 실패: " + message);
  }
};

window.sendMasterTestPush = async function sendMasterTestPush(){
  try{
    wexaToast("마스터 테스트 푸시 발송 중...");
    const res = await fetch(`${WEXA_SUPABASE_URL}/functions/v1/send-wexa-push`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": WEXA_SUPABASE_KEY,
        "Authorization": `Bearer ${WEXA_SUPABASE_KEY}`
      },
      body: JSON.stringify({
        worker_id: "MASTER",
        worker_name: "WEXA MASTER",
        application_id: "MASTER_TEST_" + Date.now(),
        job_id: "MASTER_TEST",
        event_type: "master_self_test",
        title: "WEXA 마스터 알림",
        body: "마스터 테스트 푸시가 정상 수신되었습니다."
      })
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok || !json.ok) {
      console.warn("MASTER 테스트 푸시 실패", json);
      wexaToast("마스터 테스트 푸시 실패: " + (json.message || res.status));
      return;
    }
    wexaToast("마스터 테스트 푸시 요청 완료 · 수신 확인");
  }catch(err){
    const message = err && err.message ? err.message : String(err);
    console.error("MASTER 테스트 푸시 오류", err);
    wexaToast("마스터 테스트 푸시 오류: " + message);
  }
};
