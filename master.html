/* ===== FlowIQ MASTER v4.0.6 Date + Pay Notice Patch ===== */
function parseWorkScheduleMaster(job){
  const raw=String(job?.work_time||'').trim();
  const re=/^\[\[FIQ_DATE:([^|\]]*)\|([^\]]*)\]\]\s*/;
  const m=raw.match(re);
  const start=m?m[1]:'';
  const end=m?(m[2]||m[1]):start;
  const time=m?raw.replace(re,'').trim():raw;
  const fmt=(d)=>{const mm=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return mm?`${mm[1]}.${mm[2]}.${mm[3]}`:String(d||'날짜 미정')};
  return {dateText:start?(end&&end!==start?`${fmt(start)} ~ ${fmt(end)}`:fmt(start)):'날짜 미정', timeText:time||'-'};
}
function render(){
  jobCount.innerText=jobs.length;
  pendingCount.innerText=jobs.filter(j=>status(j)==='입금대기').length;
  liveCount.innerText=jobs.filter(j=>status(j)==='게시중').length;
  matchCount.innerText=apps.filter(a=>String(a.status||'').trim()==='승인').length;

  jobsEl=document.getElementById('jobs');
  jobsEl.innerHTML=jobs.map(j=>{
    const st=status(j);
    const schedule=parseWorkScheduleMaster(j);
    const matched=matchApps(j.id);
    const remain=Math.max(0,(Number(j.needed)||0)-matched.length);
    const workers=matched.length?matched.map(a=>`<div class="worker"><div class="worker-name">${esc(a.worker_name||a.name||'이름없음')} · 매칭 ${matchAppsByPhone(a.phone)}회 · 거절 ${rejectAppsByPhone(a.phone)}회</div><div class="worker-meta">${esc(a.phone||'번호없음')}</div></div>`).join(''):`<div class="worker"><div class="worker-meta">아직 승인된 근로자가 없습니다.</div></div>`;
    return `<div class="card"><div class="row"><div><div class="title">${esc(j.title||'공고명 없음')}</div><div class="badge">${esc(st)} · ${esc(jobType(j))}</div></div><div class="badge">매칭 ${matched.length}/${Number(j.needed)||0}</div></div><div class="info">📅 ${esc(schedule.dateText)}</div><div class="info">⏰ ${esc(schedule.timeText)}</div><div class="info">📍 ${esc(j.location||'-')}</div><div class="job-pay-grid"><div class="info pay-line-clean"><span class="pay-emoji">👥</span><span class="pay-text">모집 ${Number(j.needed)||0}명 · 매칭 ${matched.length}명 · 남은 ${remain}명</span></div><div class="info pay-line-clean"><span class="pay-emoji">💰</span><span class="pay-text">일당 ${won(j.salary)}</span></div><div class="info pay-line-clean"><span class="pay-emoji">💸</span><span class="pay-text">플랫폼 수수료 ${won(fee(j))}</span></div></div><div class="pay-direct-note"><span class="note-mark">※</span><span class="note-text">FlowIQ Crew는 플랫폼 수수료만 확인합니다.<br>근로자 임금은 업체가 직접 지급합니다.</span></div><div class="actions">${st==='입금대기'||st==='입금확인'?`<button class="green" onclick="publishJob(${Number(j.id)})">수수료 확인 · 게시승인</button>`:''}${st==='게시중'?`<button class="gray" onclick="closeJob(${Number(j.id)})">공고마감</button>`:''}<button class="red" onclick="deleteJob(${Number(j.id)})">삭제</button></div><details style="margin-top:12px"><summary class="badge">승인 근로자 보기</summary>${workers}</details></div>`;

}
