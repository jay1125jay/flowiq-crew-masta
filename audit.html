<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020617"><title>WEXA MASTER 운영 로그</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020617;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{display:flex;justify-content:center}.app{width:100%;max-width:720px;padding:24px 16px 70px}.brand{font-size:28px;font-weight:950;color:#dbeafe}.sub{margin-top:6px;color:#94a3b8;font-size:13px;line-height:1.5}.card{margin-top:12px;padding:15px;border-radius:18px;background:#0f172a;border:1px solid rgba(148,163,184,.15)}.event{font-size:15px;font-weight:900;color:#bfdbfe}.meta{margin-top:6px;color:#94a3b8;font-size:12px}.details{margin-top:8px;color:#cbd5e1;font-size:12px;line-height:1.5;word-break:break-word}.empty{margin-top:14px;padding:18px;border:1px dashed rgba(148,163,184,.25);border-radius:18px;color:#94a3b8;line-height:1.5}button{width:100%;min-height:50px;margin-top:12px;border:1px solid rgba(148,163,184,.24);border-radius:16px;background:linear-gradient(180deg,#334155,#1e293b);color:#fff;font-size:14px;font-weight:900}.row{display:flex;gap:8px}.row button{flex:1}.version{margin-top:14px;text-align:center;color:#64748b;font-size:11px}</style></head><body><div class="app"><div class="brand">WEXA MASTER 운영 로그</div><div class="sub">공고·신청·승인·완료·출근 등 핵심 상태 변경을 읽기 전용으로 확인합니다. 개인정보 원문 대신 운영 식별값과 상태 중심으로 기록합니다.</div><div id="root"><div class="empty">운영 로그를 불러오고 있습니다.</div></div><div class="row"><button onclick="location.href='./master.html?v=511'">마스터 홈</button><button onclick="load()">새로고침</button></div><div class="version">WEXA MASTER AUDIT v1.0 · 2026-09-03</div></div><script>
const SUPABASE_URL='https://zhbzphvqiiijfjqnktlo.supabase.co';const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYWJhc2UiLCJyZWYiOiJ6aGJ6cGh2cWlpaWZqanFua3RsbyIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzc5MDQxMDU3LCJleHAiOjIwOTQ2MTcwNTB9.ufIPHJh2fzRLm5taos3yTz6pGlEHFKaSoYI2Ref3T5I';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const root=document.getElementById('root');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function dt(v){try{return new Date(v).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})}catch(e){return String(v||'-')}}const labels={job_created:'공고 등록',job_status_changed:'공고 상태 변경',application_created:'근로 신청',application_status_changed:'신청 상태 변경',worker_checked_in:'출근 확인'};async function load(){root.innerHTML='<div class="empty">운영 로그를 불러오고 있습니다.</div>';const {data:u,error:ue}=await db.auth.getUser();const user=u?.user;if(ue||!user||String(user.app_metadata?.role||'')!=='admin'){root.innerHTML='<div class="empty">마스터 관리자 로그인이 필요합니다.</div>';return}const {data:rows,error}=await db.from('wexa_operation_logs').select('id,event_type,entity_type,entity_id,actor_role,details,created_at').order('created_at',{ascending:false}).limit(500);if(error){root.innerHTML='<div class="empty">운영 로그 조회에 실패했습니다.</div>';return}if(!rows?.length){root.innerHTML='<div class="empty">아직 기록된 운영 로그가 없습니다.</div>';return}root.innerHTML=rows.map(r=>`<div class="card"><div class="event">${esc(labels[r.event_type]||r.event_type)}</div><div class="meta">${esc(r.entity_type)} #${esc(r.entity_id)} · ${esc(r.actor_role||'-')} · ${esc(dt(r.created_at))}</div><div class="details">${esc(JSON.stringify(r.details||{}))}</div></div>`).join('')}load();
</script></body></html>
