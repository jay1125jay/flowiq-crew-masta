<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlowIQ Crew MASTER v3.1.8.6 HOTFIX</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#020617;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:460px;min-height:100vh;padding:24px 18px 90px}.brand{font-size:28px;font-weight:950;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.sub{color:#94a3b8;font-size:14px;line-height:1.45}.title{font-size:21px;font-weight:900;margin-bottom:6px}.section{font-size:21px;font-weight:950;margin:24px 0 12px}.card{background:linear-gradient(180deg,rgba(15,23,42,.98),rgba(17,24,39,.98));border:1px solid rgba(148,163,184,.12);border-radius:26px;padding:18px;margin-bottom:14px;box-shadow:0 12px 34px rgba(0,0,0,.28)}.notice{border-color:rgba(96,165,250,.22);background:linear-gradient(135deg,rgba(37,99,235,.18),rgba(59,130,246,.08))}input{width:100%;min-height:54px;border:1px solid rgba(255,255,255,.08);background:#0f172a;color:white;border-radius:18px;padding:0 14px;font-size:15px;margin:10px 0}button{border:0;border-radius:18px;min-height:50px;padding:0 14px;color:#fff;font-weight:850;background:#334155;cursor:pointer}.blue{background:#2563eb}.green{background:#059669}.red{background:#dc2626}.gray{background:#334155}.yellow{background:#d97706}.full{width:100%;margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none!important}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900;background:rgba(59,130,246,.16);color:#bfdbfe;margin-top:6px}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.meta{font-size:13px;color:#cbd5e1;line-height:1.5;margin-top:8px}.danger{background:rgba(239,68,68,.12);border:1px solid rgba(248,113,113,.22);color:#fecaca;border-radius:18px;padding:12px;font-size:13px}.status{display:inline-flex;padding:7px 12px;border-radius:999px;color:white;font-size:12px;font-weight:950;margin-top:8px}.wait{background:#d97706}.paid{background:#2563eb}.live{background:#059669}.closed{background:#dc2626}button:disabled{opacity:.45;cursor:not-allowed}.mini{font-size:12px;color:#94a3b8;margin-top:6px}.paydone{background:#16a34a}.paywait{background:#2563eb}.worker-card-title{font-size:18px;font-weight:950;margin-bottom:6px}
</style>
</head>
<body>
<main class="app">
  <div class="brand">FlowIQ MASTER</div>
  <div class="sub">Internal Admin · v3.1.8.6 HOTFIX</div>

  <section id="loginBox" class="card notice">
    <div class="title">MASTER 로그인</div>
    <div class="sub">내부 관리자 전용 페이지입니다.</div>
    <input id="masterPassword" type="password" placeholder="MASTER 비밀번호" />
    <button class="full blue" onclick="loginMaster()">접속</button>
  </section>

  <section id="masterApp" class="hidden">
    <div class="card notice">
      <div class="title">MASTER 운영센터</div>
      <div class="sub">입금확인 → 게시승인 → 공고 노출을 관리합니다.</div>
      <button class="full green" onclick="refreshMaster()">새로고침</button>
    </div>

    <div class="section">공고 운영 관리</div>
    <div id="jobsBox"></div>
  </section>
</main>
<script>
const SUPABASE_URL="https://zhbzphvqiiijfjqnktlo.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6InpoYnpwaHZxaWlpamZqcW5rdGxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDEwNTcsImV4cCI6MjA5NDYxNzA1N30.ufIPHJh2fzRLm5taos3yTz6pGlEHFKaSoYI2Ref3T5I";
</script>
<script>
// 위 SUPABASE_KEY 오타 방지용: 실제 기존 키로 재선언
const REAL_SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpoYnpwaHZxaWlpamZqcW5rdGxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDEwNTcsImV4cCI6MjA5NDYxNzA1N30.ufIPHJh2fzRLm5taos3yTz6pGlEHFKaSoYI2Ref3T5I";
const db=supabase.createClient(SUPABASE_URL,REAL_SUPABASE_KEY);
const MASTER_PASSWORD="1234";
const COMPANY_NAMES={demo_company:"FlowIQ Demo",alpha:"Alpha Logistics",beta:"Beta Factory"};
let jobs=[];let applications=[];let attendance=[];
function won(n){return Number(n||0).toLocaleString("ko-KR")+"원"}
function esc(v){return String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))}
function rawType(j){return String(j?.type||"공고").trim()}
function parseType(j){
  const text=rawType(j);
  const m=text.match(/^\[(입금대기|입금확인|게시중|공고마감)(?::(입금대기|입금확인|게시중))?\]\s*/);
  return {status:m?m[1]:"입금대기",prev:m&&m[2]?m[2]:"",type:text.replace(/^\[(입금대기|입금확인|게시중|공고마감)(?::(입금대기|입금확인|게시중))?\]\s*/,"").trim()||"공고"};
}
function jobStatus(j){return parseType(j).status}
function previousStatus(j){return parseType(j).prev||"입금대기"}
function jobType(j){return parseType(j).type}
function statusClass(st){return st==="공고마감"?"closed":(st==="게시중"?"live":(st==="입금확인"?"paid":"wait"))}
function statusText(st){return st==="입금대기"?"입금전":st}
function statusLabel(j){const st=jobStatus(j);return `<span class="status ${statusClass(st)}">${statusText(st)}</span>`}
function cleanType(type){return String(type||"공고").replace(/^\[(입금대기|입금확인|게시중|공고마감)(?::(입금대기|입금확인|게시중))?\]\s*/,"").trim()||"공고"}
function makeType(status,type){return `[${status}] `+cleanType(type)}
function makeClosedType(prev,type){return `[공고마감:${prev||"게시중"}] `+cleanType(type)}
function isJobFull(j){const needed=Number(j&&j.needed||0);const applied=Number(j&&j.applied||0);return needed>0&&applied>=needed}
function visibleStatus(j){return isJobFull(j)?'공고마감':jobStatus(j)}
async function loginMaster(){const pw=document.getElementById('masterPassword').value;if(pw!==MASTER_PASSWORD){alert('비밀번호가 틀렸습니다.');return}document.getElementById('loginBox').classList.add('hidden');document.getElementById('masterApp').classList.remove('hidden');await loadMasterData()}
async function loadMasterData(){const jr=await db.from('jobs').select('*').order('created_at',{ascending:false});const ar=await db.from('applications').select('*').order('created_at',{ascending:false});const tr=await db.from('attendance').select('*').order('created_at',{ascending:false});if(jr.error)alert('jobs 오류: '+jr.error.message);if(ar.error)alert('applications 오류: '+ar.error.message);if(tr.error)alert('attendance 오류: '+tr.error.message);jobs=jr.data||[];applications=ar.data||[];attendance=tr.data||[];renderAll()}
function renderAll(){renderJobs()}
async function refreshMaster(){
  const box=document.getElementById('jobsBox');
  if(box)box.innerHTML='<div class="card"><div class="sub">새로고침 중...</div></div>';
  await loadMasterData();
}
async function reopenJob(id){
  const job=jobs.find(j=>Number(j.id)===Number(id));
  if(!job)return alert('공고를 찾을 수 없습니다.');
  if(jobStatus(job)!=='공고마감')return alert('마감 상태가 아닙니다.');
  if(isJobFull(job))return alert('필요 인원이 꽉 차서 마감해제할 수 없습니다.');
  const restore=previousStatus(job);
  if(!confirm('공고마감을 해제하고 '+statusText(restore)+' 상태로 되돌릴까요?'))return;
  const {error}=await db.from('jobs').update({type:makeType(restore,jobType(job))}).eq('id',id);
  if(error){alert('마감해제 오류: '+error.message);return}
  await loadMasterData();
  alert('마감해제 완료: '+statusText(restore));
}

function renderJobs(){
  const box=document.getElementById('jobsBox');
  box.innerHTML=jobs.length?jobs.map(j=>{
    const st=visibleStatus(j);
    const canPay=jobStatus(j)!=='공고마감'&&!isJobFull(j);
    const canPost=jobStatus(j)!=='공고마감'&&!isJobFull(j);
    const jobApps=applications.filter(a=>Number(a.job_id)===Number(j.id));
    const approved=jobApps.filter(a=>['승인','출근완료','입금완료'].includes(a.status||'지원')).length;
    const checked=jobApps.filter(a=>attendance.some(t=>String(t.phone||'')===String(a.phone||'')&&String(t.job_id||'')===String(j.id))).length;
    const workerRows=jobApps.length?jobApps.map(a=>renderWorkerInfoRow(a,j)).join(''):`<div class="danger">이 공고에 연결된 근로자가 없습니다.</div>`;
    return `<div class="card">
      <div class="row">
        <div>
          <div class="title">${esc(j.title)}</div>
          <div class="badge">${esc(COMPANY_NAMES[j.company_id]||j.company_id||'업체없음')}</div><br>
          <span class="status ${statusClass(st)}">${statusText(st)}</span>
        </div>
        <button class="red" onclick="deleteJob(${j.id})">삭제</button>
      </div>
      <div class="meta">📍 ${esc(j.location)}<br>🕒 ${esc(j.work_time)}<br>💰 ${won(j.salary)} · 👥 ${j.applied||0}/${j.needed||0}${isJobFull(j)?' · 공고마감':''}<br>작업: ${esc(jobType(j))} · 언어: ${esc(j.language)}<br>지원 ${jobApps.length}명 · 승인 ${approved}명 · 출근 ${checked}명</div>
      <div class="grid2" style="margin-top:12px">
        <button class="yellow" onclick="setJobStatus(${j.id},'입금확인')">입금확인</button>
        <button class="green" onclick="setJobStatus(${j.id},'게시중')">게시승인</button>
      </div>
      ${jobStatus(j)==='공고마감'
        ? `<button class="full green" onclick="reopenJob(${j.id})">마감해제</button>`
        : `<button class="full gray" onclick="setJobStatus(${j.id},'공고마감')">공고마감</button>`}
      <button class="full blue" onclick="toggleWorkerInfo(${j.id})">근로자 정보 보기</button>
      <div id="workerInfo_${j.id}" class="hidden" style="margin-top:12px">${workerRows}</div>
    </div>`
  }).join(''):`<div class="card"><div class="sub">등록된 공고가 없습니다.</div></div>`
}
function toggleWorkerInfo(jobId){
  const el=document.getElementById('workerInfo_'+jobId);
  if(el)el.classList.toggle('hidden');
}
function renderWorkerInfoRow(a,job){
  const status=a.status||'지원';
  const paid=status==='입금완료';
  return `<div class="card" style="margin:10px 0;background:rgba(15,23,42,.72)">
    <div class="row"><div><div class="worker-card-title">${esc(a.worker_name||'이름없음')}</div><span class="status ${paid?'paydone':'paywait'}">${paid?'입금완료':'입금전'}</span></div></div>
    <div class="meta"><b>근로자 정보</b><br>연락처: ${esc(a.phone||'번호없음')}<br><br><b>현장 정보</b><br>공고: ${esc(job?job.title:'삭제된 공고')}<br>위치: ${esc(job?job.location:'-')}<br>근무시간: ${esc(job?job.work_time:'-')}<br>일급: ${job?won(job.salary):'-'}<br>출근: ${getAttendanceStatus(a)}<br><br><b>계좌 정보</b><br>${getBankInfo(a)}</div>
    <button class="full green" ${paid?'disabled':''} onclick="markWorkerPaid(${a.id})">입금 완료</button>
  </div>`
}
function getBankInfo(a){const bank=a.bank_name||a.bank||a.account_bank||'';const number=a.account_number||a.account||a.bank_account||'';const holder=a.account_holder||a.holder||a.worker_name||'';if(!bank&&!number&&!holder)return '계좌정보 없음';return `${bank?esc(bank)+' ':''}${number?esc(number)+' ':''}${holder?'/ '+esc(holder):''}`}
function getAttendanceStatus(a){const found=attendance.find(t=>String(t.phone||'')===String(a.phone||'')&&String(t.job_id||'')===String(a.job_id||''));return found?'출근기록 있음':'출근기록 없음'}
async function setJobStatus(id,status){
  const job=jobs.find(j=>Number(j.id)===Number(id));
  if(!job)return alert('공고를 찾을 수 없습니다.');
  const current=jobStatus(job);
  if(current==='공고마감')return alert('공고마감 상태입니다. 먼저 마감해제를 눌러주세요.');
  if(isJobFull(job))return alert('필요 인원이 꽉 차서 상태를 변경할 수 없습니다.');
  if(status==='입금확인'&&current==='입금확인')return alert('이미 입금확인 상태입니다.');
  if(status==='입금확인'&&current==='게시중')return alert('이미 게시승인된 공고입니다.');
  if(status==='게시중'&&current!=='입금확인')return alert('입금확인 후 게시승인할 수 있습니다.');
  const nextType=status==='공고마감'?makeClosedType(current,jobType(job)):makeType(status,jobType(job));
  const {error}=await db.from('jobs').update({type:nextType}).eq('id',id);
  if(error){alert('공고 상태 변경 오류: '+error.message);return}
  await loadMasterData();
  alert(statusText(status)+' 처리 완료');
}
async function markWorkerPaid(id){if(!confirm('이 근로자를 입금 완료 처리할까요?'))return;const {error}=await db.from('applications').update({status:'입금완료'}).eq('id',id);if(error){alert('입금 완료 처리 오류: '+error.message);return}await loadMasterData();alert('입금 완료 처리됨')}
async function deleteJob(id){if(!confirm('이 공고를 삭제할까요?'))return;const {error}=await db.from('jobs').delete().eq('id',id);if(error){alert('삭제 오류: '+error.message);return}await loadMasterData()}
</script>
</body>
</html>
