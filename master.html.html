<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlowIQ Crew MASTER v3.0.1</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#020617;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:460px;min-height:100vh;padding:24px 18px 90px}
.brand{font-size:28px;font-weight:950;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#94a3b8;font-size:14px;line-height:1.45}.title{font-size:21px;font-weight:900;margin-bottom:6px}.section{font-size:21px;font-weight:950;margin:24px 0 12px}
.card{background:linear-gradient(180deg,rgba(15,23,42,.98),rgba(17,24,39,.98));border:1px solid rgba(148,163,184,.12);border-radius:26px;padding:18px;margin-bottom:14px;box-shadow:0 12px 34px rgba(0,0,0,.28)}
.notice{border-color:rgba(96,165,250,.22);background:linear-gradient(135deg,rgba(37,99,235,.18),rgba(59,130,246,.08))}
input{width:100%;min-height:54px;border:1px solid rgba(255,255,255,.08);background:#0f172a;color:white;border-radius:18px;padding:0 14px;font-size:15px;margin:10px 0}
button{border:0;border-radius:18px;min-height:50px;padding:0 14px;color:#fff;font-weight:850;background:#334155;cursor:pointer}.blue{background:#2563eb}.green{background:#059669}.red{background:#dc2626}.gray{background:#334155}.full{width:100%;margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none!important}
.badge{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900;background:rgba(59,130,246,.16);color:#bfdbfe;margin-top:6px}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.meta{font-size:13px;color:#cbd5e1;line-height:1.5;margin-top:8px}.danger{background:rgba(239,68,68,.12);border:1px solid rgba(248,113,113,.22);color:#fecaca;border-radius:18px;padding:12px;font-size:13px}
</style>
</head>
<body>
<main class="app">
  <div class="brand">FlowIQ MASTER</div>
  <div class="sub">Internal Admin · v3.0.1</div>

  <section id="loginBox" class="card notice">
    <div class="title">MASTER 로그인</div>
    <div class="sub">내부 관리자 전용 페이지입니다.</div>
    <input id="masterPassword" type="password" placeholder="MASTER 비밀번호" />
    <button class="full blue" onclick="loginMaster()">접속</button>
  </section>

  <section id="masterApp" class="hidden">
    <div class="card notice">
      <div class="title">MASTER 운영센터</div>
      <div class="sub">공고, 지원자, 출근 기록을 전체 관리합니다.</div>
      <button class="full green" onclick="loadMasterData()">새로고침</button>
    </div>

    <div class="danger">
      입금확인/게시승인 자동화는 다음 단계에서 DB 상태 컬럼 연결 후 적용합니다. 현재 v3.0.1은 MASTER 분리와 DB 연결 수정 버전입니다.
    </div>

    <div class="section">전체 공고</div>
    <div id="jobsBox"></div>

    <div class="section">지원자 관리</div>
    <div id="applicationsBox"></div>

    <div class="section">출근 기록</div>
    <div id="attendanceBox"></div>
  </section>
</main>
<script>
const SUPABASE_URL="https://zhbzphvqiiijfjqnktlo.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpoYnpwaHZxaWlpamZqcW5rdGxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDEwNTcsImV4cCI6MjA5NDYxNzA1N30.ufIPHJh2fzRLm5taos3yTz6pGlEHFKaSoYI2Ref3T5I";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const MASTER_PASSWORD="1234";
const COMPANY_NAMES={demo_company:"FlowIQ Demo",alpha:"Alpha Logistics",beta:"Beta Factory"};
let jobs=[];let applications=[];let attendance=[];
function won(n){return Number(n||0).toLocaleString("ko-KR")+"원"}
function esc(v){return String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))}
async function loginMaster(){
  const pw=document.getElementById('masterPassword').value;
  if(pw!==MASTER_PASSWORD){alert('비밀번호가 틀렸습니다.');return}
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('masterApp').classList.remove('hidden');
  await loadMasterData();
}
async function loadMasterData(){
  const jr=await db.from('jobs').select('*').order('created_at',{ascending:false});
  const ar=await db.from('applications').select('*').order('created_at',{ascending:false});
  const tr=await db.from('attendance').select('*').order('created_at',{ascending:false});
  if(jr.error)alert('jobs 오류: '+jr.error.message);
  if(ar.error)alert('applications 오류: '+ar.error.message);
  if(tr.error)alert('attendance 오류: '+tr.error.message);
  jobs=jr.data||[];applications=ar.data||[];attendance=tr.data||[];
  renderAll();
}
function renderAll(){renderJobs();renderApplications();renderAttendance()}
function renderJobs(){
  const box=document.getElementById('jobsBox');
  box.innerHTML=jobs.length?jobs.map(j=>`<div class="card">
    <div class="row"><div><div class="title">${esc(j.title)}</div><div class="badge">${esc(COMPANY_NAMES[j.company_id]||j.company_id||'업체없음')}</div></div><button class="red" onclick="deleteJob(${j.id})">삭제</button></div>
    <div class="meta">📍 ${esc(j.location)}<br>🕒 ${esc(j.work_time)}<br>💰 ${won(j.salary)} · 👥 ${j.applied||0}/${j.needed||0}<br>작업: ${esc(j.type)} · 언어: ${esc(j.language)}</div>
  </div>`).join(''):`<div class="card"><div class="sub">등록된 공고가 없습니다.</div></div>`;
}
function renderApplications(){
  const box=document.getElementById('applicationsBox');
  box.innerHTML=applications.length?applications.map(a=>{
    const job=jobs.find(j=>Number(j.id)===Number(a.job_id));
    const status=a.status||'지원';
    return `<div class="card">
      <div class="title">${esc(a.worker_name||'이름없음')}</div>
      <div class="meta">연락처: ${esc(a.phone||'번호없음')}<br>공고: ${esc(job?job.title:'삭제된 공고')}<br>업체: ${esc(a.company_id||'업체없음')}<br>상태: ${esc(status)}</div>
      <div class="grid2"><button class="green" onclick="updateApplication(${a.id},'승인')">승인</button><button class="red" onclick="updateApplication(${a.id},'거절')">거절</button></div>
    </div>`;
  }).join(''):`<div class="card"><div class="sub">지원자가 없습니다.</div></div>`;
}
function renderAttendance(){
  const box=document.getElementById('attendanceBox');
  box.innerHTML=attendance.length?attendance.map(a=>`<div class="card">
    <div class="title">${esc(a.worker_name||'이름없음')}</div>
    <div class="meta">${esc(a.phone||'번호없음')}<br>${esc(a.job_title||'')}<br>${a.created_at?new Date(a.created_at).toLocaleString():''}</div>
  </div>`).join(''):`<div class="card"><div class="sub">출근 기록이 없습니다.</div></div>`;
}
async function updateApplication(id,status){
  const {error}=await db.from('applications').update({status}).eq('id',id);
  if(error){alert('처리 오류: '+error.message);return}
  await loadMasterData();alert(status+' 처리 완료');
}
async function deleteJob(id){
  if(!confirm('이 공고를 삭제할까요?'))return;
  const {error}=await db.from('jobs').delete().eq('id',id);
  if(error){alert('삭제 오류: '+error.message);return}
  await loadMasterData();
}
</script>
</body>
</html>
