<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlowIQ Crew MASTER v3.4.2 SETTLEMENT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#020617;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:460px;min-height:100vh;padding:24px 18px 90px}.brand{font-size:28px;font-weight:950;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.sub{color:#94a3b8;font-size:14px;line-height:1.45}.title{font-size:21px;font-weight:900;margin-bottom:6px}.section{font-size:21px;font-weight:950;margin:24px 0 12px}.card{background:linear-gradient(180deg,rgba(15,23,42,.98),rgba(17,24,39,.98));border:1px solid rgba(148,163,184,.12);border-radius:26px;padding:18px;margin-bottom:14px;box-shadow:0 12px 34px rgba(0,0,0,.28)}.notice{border-color:rgba(96,165,250,.22);background:linear-gradient(135deg,rgba(37,99,235,.18),rgba(59,130,246,.08))}input{width:100%;min-height:54px;border:1px solid rgba(255,255,255,.08);background:#0f172a;color:white;border-radius:18px;padding:0 14px;font-size:15px;margin:10px 0}button{border:0;border-radius:18px;min-height:50px;padding:0 14px;color:#fff;font-weight:850;background:#334155;cursor:pointer}.blue{background:#2563eb}.green{background:#059669}.red{background:#dc2626}.gray{background:#334155}.yellow{background:#d97706}.full{width:100%;margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none!important}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900;background:rgba(59,130,246,.16);color:#bfdbfe;margin-top:6px}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.meta{font-size:13px;color:#cbd5e1;line-height:1.5;margin-top:8px}.danger{background:rgba(239,68,68,.12);border:1px solid rgba(248,113,113,.22);color:#fecaca;border-radius:18px;padding:12px;font-size:13px}.status{display:inline-flex;padding:7px 12px;border-radius:999px;color:white;font-size:12px;font-weight:950;margin-top:8px}.wait{background:#d97706}.paid{background:#2563eb}.live{background:#059669}.closed{background:#dc2626}button:disabled{opacity:.45;cursor:not-allowed}.mini{font-size:12px;color:#94a3b8;margin-top:6px}.paydone{background:#16a34a}.paywait{background:#2563eb}.worker-card-title{font-size:18px;font-weight:950;margin-bottom:6px}

/* v3.1.9.3 UI TEXT FIX: prevent filter/buttons/cards from being cut off */
.filter-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 14px;padding-bottom:4px;width:100%}
.filter-row button{width:100%;min-width:0;min-height:42px;border-radius:999px;font-size:12px;background:#1e293b;white-space:normal;line-height:1.2;padding:8px 10px}
.filter-row button:first-child{grid-column:1 / -1}
.filter-row button.active{background:#2563eb;box-shadow:0 8px 22px rgba(37,99,235,.35)}
.row{flex-wrap:wrap}
.row>div{min-width:0;max-width:100%}
.card{overflow:hidden}
.title{word-break:keep-all;overflow-wrap:anywhere}
.meta{word-break:keep-all;overflow-wrap:anywhere}
.grid2{grid-template-columns:1fr 1fr}
@media(max-width:380px){.app{padding:20px 14px 80px}.grid2{grid-template-columns:1fr}.filter-row{grid-template-columns:1fr}button{font-size:13px;padding:0 10px}}

.settle-note{background:rgba(245,158,11,.12);border:1px solid rgba(251,191,36,.20);color:#fde68a;border-radius:16px;padding:12px;font-size:12px;line-height:1.45;margin-top:10px}
.settle-state{display:inline-flex;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:950;margin-top:8px}
.settle-wait{background:linear-gradient(135deg,#d97706,#f59e0b);color:#fff}
.settle-checking{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff}
.settle-done{background:linear-gradient(135deg,#059669,#22c55e);color:#fff}
</style>
</head>
<body>
<main class="app">
  <div class="brand">FlowIQ MASTER</div>
  <div class="sub">Internal Admin · v3.4.0 SETTLEMENT</div>

  <section id="loginBox" class="card notice">
    <div class="title">MASTER 로그인</div>
    <div class="sub">내부 관리자 전용 페이지입니다.</div>
    <input id="masterPassword" type="password" placeholder="MASTER 비밀번호" />
    <button class="full blue" onclick="loginMaster()">접속</button>
  </section>

  <section id="masterApp" class="hidden">
    <div class="card notice">
      <div class="title">MASTER 운영센터</div>
      <div class="sub">입금확인 → 게시승인 → 공고 노출을 관리합니다.</div>
      <button class="full green" onclick="refreshMaster()">새로고침</button>
    </div>

    <div class="section">공고 운영 관리</div>
    <div id="jobFilterBox" class="filter-row"></div>
    <div id="jobsBox"></div>
  </section>
</main>
<script>
const SUPABASE_URL="https://zhbzphvqiiijfjqnktlo.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6InpoYnpwaHZxaWlpamZqcW5rdGxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDEwNTcsImV4cCI6MjA5NDYxNzA1N30.ufIPHJh2fzRLm5taos3yTz6pGlEHFKaSoYI2Ref3T5I";
</script>
<script>
// 위 SUPABASE_KEY 오타 방지용: 실제 기존 키로 재선언
const REAL_SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpoYnpwaHZxaWlpamZqcW5rdGxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDEwNTcsImV4cCI6MjA5NDYxNzA1N30.ufIPHJh2fzRLm5taos3yTz6pGlEHFKaSoYI2Ref3T5I";
const db=supabase.createClient(SUPABASE_URL,REAL_SUPABASE_KEY);
const MASTER_PASSWORD="1234";
const COMPANY_NAMES={demo_company:"FlowIQ Demo",alpha:"Alpha Logistics",beta:"Beta Factory"};
let jobs=[];let applications=[];let attendance=[];let jobFilter="전체";
function won(n){return Number(n||0).toLocaleString("ko-KR")+"원"}
function feeAmount(base){return Math.round(Number(base||0)*0.05)}
function totalPayment(base){return Number(base||0)+feeAmount(base)}
function esc(v){return String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))}
function getManagerAccounts(){try{return JSON.parse(localStorage.getItem("crew_manager_accounts")||"[]")}catch(e){return []}}
function getWorkerAccounts(){try{return JSON.parse(localStorage.getItem("crew_worker_accounts")||"[]")}catch(e){return []}}
function normalizePhone(v){return String(v||"").replace(/[^0-9]/g,"")}
function rawType(j){return String(j?.type||"공고").trim()}
function parseType(j){
  const text=rawType(j);
  const re=/^\[(입금대기|입금전|입금확인|입금완료|게시중|공고마감)(?::(입금대기|입금전|입금확인|입금완료|게시중))?\]\s*/;
  const m=text.match(re);
  let status=m?m[1]:"입금대기";
  let prev=m&&m[2]?m[2]:"";
  if(status==="입금전")status="입금대기";
  if(status==="입금완료")status="입금확인";
  if(prev==="입금전")prev="입금대기";
  if(prev==="입금완료")prev="입금확인";
  return {status,prev,type:text.replace(re,"").trim()||"공고"};
}
function jobStatus(j){return parseType(j).status}
function previousStatus(j){return parseType(j).prev||"입금대기"}
function jobType(j){return parseType(j).type}
function statusClass(st){return st==="공고마감"?"closed":(st==="게시중"?"live":(st==="입금확인"?"paid":"wait"))}
function statusText(st){return st==="입금대기"?"입금전":(st==="입금확인"?"입금완료":st)}
function statusLabel(j){const st=jobStatus(j);return `<span class="status ${statusClass(st)}">${statusText(st)}</span>`}
function cleanType(type){return String(type||"공고").replace(/^\[(입금대기|입금전|입금확인|입금완료|게시중|공고마감)(?::(입금대기|입금전|입금확인|입금완료|게시중))?\]\s*/,"").trim()||"공고"}
function makeType(status,type){return `[${status}] `+cleanType(type)}
function makeClosedType(prev,type){return `[공고마감:${prev||"입금대기"}] `+cleanType(type)}
function isJobFull(j){const needed=Number(j&&j.needed||0);const applied=Number(j&&j.applied||0);return needed>0&&applied>=needed}
function visibleStatus(j){return isJobFull(j)?'공고마감':jobStatus(j)}
async function loginMaster(){const pw=document.getElementById('masterPassword').value;if(pw!==MASTER_PASSWORD){alert('비밀번호가 틀렸습니다.');return}document.getElementById('loginBox').classList.add('hidden');document.getElementById('masterApp').classList.remove('hidden');await loadMasterData()}
async function loadMasterData(){const jr=await db.from('jobs').select('*').order('created_at',{ascending:false});const ar=await db.from('applications').select('*').order('created_at',{ascending:false});const tr=await db.from('attendance').select('*').order('created_at',{ascending:false});if(jr.error)alert('jobs 오류: '+jr.error.message);if(ar.error)alert('applications 오류: '+ar.error.message);if(tr.error)alert('attendance 오류: '+tr.error.message);jobs=jr.data||[];applications=ar.data||[];attendance=tr.data||[];renderAll()}
function renderAll(){renderJobFilters();renderJobs()}
async function refreshMaster(){
  const box=document.getElementById('jobsBox');
  if(box)box.innerHTML='<div class="card"><div class="sub">새로고침 중...</div></div>';
  await loadMasterData();
}
async function reopenJob(id){
  const job=jobs.find(j=>Number(j.id)===Number(id));
  if(!job)return alert('공고를 찾을 수 없습니다.');
  if(jobStatus(job)!=='공고마감')return alert('마감 상태가 아닙니다.');
  if(isJobFull(job))return alert('필요 인원이 꽉 차서 마감해제할 수 없습니다.');
  const restore='입금대기';
  if(!confirm('공고마감을 해제하고 입금전 상태로 되돌릴까요?'))return;
  const {error}=await db.from('jobs').update({type:makeType(restore,jobType(job))}).eq('id',id);
  if(error){alert('마감해제 오류: '+error.message);return}
  await loadMasterData();
  alert('마감해제 완료: 입금전');
}

function filterKey(j){return statusText(visibleStatus(j))}
function filterLabel(key){return key==='입금확인'?'입금완료':key}
function renderJobFilters(){
  const box=document.getElementById('jobFilterBox');
  if(!box)return;
  const keys=['전체','입금전','입금완료','게시중','공고마감'];
  const counts={전체:jobs.length,입금전:0,입금완료:0,게시중:0,공고마감:0};
  jobs.forEach(j=>{const k=filterKey(j);if(counts[k]!==undefined)counts[k]++;});
  box.innerHTML=keys.map(k=>`<button class="${jobFilter===k?'active':''}" onclick="setJobFilter('${k}')">${k}(${counts[k]||0})</button>`).join('');
}
function setJobFilter(key){jobFilter=key;renderJobFilters();renderJobs()}
function renderJobs(){
  const box=document.getElementById('jobsBox');
  const filteredJobs=jobFilter==='전체'?jobs:jobs.filter(j=>filterKey(j)===jobFilter);
  box.innerHTML=filteredJobs.length?filteredJobs.map(j=>{
    const current=jobStatus(j);
    const st=visibleStatus(j);
    const full=isJobFull(j);
    const closed=current==='공고마감'||full;
    const canDeposit=current==='입금대기'&&!full;
    const canPost=current==='입금확인'&&!full;
    const jobApps=applications.filter(a=>Number(a.job_id)===Number(j.id));
    const approved=jobApps.filter(a=>['승인','출근완료','근무완료','입금대기','지급확인중','수령확인완료','입금완료'].includes(a.status||'지원')).length;
    const checked=jobApps.filter(a=>attendance.some(t=>String(t.phone||'')===String(a.phone||'')&&String(t.job_id||'')===String(j.id))).length;
    const workerRows=jobApps.length?jobApps.map(a=>renderWorkerInfoRow(a,j)).join(''):`<div class="danger">이 공고에 연결된 근로자가 없습니다.</div>`;
    const depositBtn=canDeposit
      ? `<button class="yellow" onclick="setJobStatus(${j.id},'입금확인')">입금완료</button>`
      : `<button class="yellow" disabled>${current==='입금확인'||current==='게시중'?'입금완료':'입금완료'}</button>`;
    const postBtn=canPost
      ? `<button class="green" onclick="setJobStatus(${j.id},'게시중')">게시승인</button>`
      : `<button class="green" onclick="guardPost('${statusText(current)}')">게시승인</button>`;
    return `<div class="card">
      <div class="row">
        <div>
          <div class="title">${esc(j.title)}</div>
          <div class="badge">${esc(COMPANY_NAMES[j.company_id]||j.company_id||'업체없음')}</div><br>
          <span class="status ${statusClass(st)}">${statusText(st)}</span>
        </div>
        <button class="red" onclick="deleteJob(${j.id})">삭제</button>
      </div>
      <div class="meta">📍 ${esc(j.location)}<br>🕒 ${esc(j.work_time)}<br>💰 업체 일당: ${won(j.salary)}<br>💸 Crew 수수료(5%): ${won(feeAmount(j.salary))}<br>🧾 총 결제금액: ${won(totalPayment(j.salary))}<br>👥 ${j.applied||0}/${j.needed||0}${full?' · 공고마감':''}<br>작업: ${esc(jobType(j))} · 언어: ${esc(j.language)}<br>지원 ${jobApps.length}명 · 승인 ${approved}명 · 출근 ${checked}명</div>
      <div class="grid2" style="margin-top:12px">
        ${depositBtn}
        ${postBtn}
      </div>
      ${current==='공고마감'
        ? `<button class="full green" onclick="reopenJob(${j.id})">마감해제</button>`
        : `<button class="full gray" onclick="setJobStatus(${j.id},'공고마감')">공고마감</button>`}
      <button class="full blue" onclick="toggleWorkerInfo(${j.id})">정보 보기</button>
      <div id="workerInfo_${j.id}" class="hidden" style="margin-top:12px">${workerRows}</div>
    </div>`
  }).join(''):`<div class="card"><div class="sub">${jobFilter} 공고가 없습니다.</div></div>`
}
function guardPost(currentText){
  if(currentText==='공고마감')return alert('공고마감 상태입니다. 먼저 마감해제를 눌러주세요.');
  if(currentText==='입금전')return alert('입금완료 후 게시승인할 수 있습니다.');
  return alert('현재 상태에서는 게시승인을 할 수 없습니다.');
}

function toggleWorkerInfo(jobId){
  const el=document.getElementById('workerInfo_'+jobId);
  if(el)el.classList.toggle('hidden');
}
function hasAccountData(a){
  const saved=getWorkerAccounts().find(w=>normalizePhone(w.phone)===normalizePhone(a&&a.phone));
  const bank=a.bank_name||a.bank||a.account_bank||(saved&&saved.bank)||'';
  const number=a.account_number||a.account||a.bank_account||(saved&&saved.account)||'';
  return !!(String(bank).trim()&&String(number).trim());
}
function settlementBadge(status){
  const s=String(status||'').trim();
  if(s==='입금완료')return '<span class="settle-state settle-done">🟢 정산완료</span>';
  if(s==='지급확인중')return '<span class="settle-state settle-checking">🟠 근로자 수령확인 대기</span>';
  if(s==='수령확인완료')return '<span class="settle-state settle-checking">🟠 MASTER 정산대기</span>';
  if(s==='근무완료'||s==='입금대기')return '<span class="settle-state settle-wait">🟡 관리자 지급확인 대기</span>';
  return '';
}
function renderWorkerInfoRow(a,job){
  const status=String(a.status||'지원').trim();
  const paid=status==='입금완료';
  const cashChecking=status==='지급확인중';
  const workerConfirmed=status==='수령확인완료';
  const accountReady=hasAccountData(a);
  const workReady=status==='근무완료'||status==='입금대기'||paid||cashChecking||workerConfirmed;
  const paymentText=paid?'정산완료':(workerConfirmed?'MASTER 정산대기':(cashChecking?'근로자 수령확인 대기':(workReady?'관리자 지급확인 대기':'근무완료 전')));
  const paymentClass=paid?'paydone':(workReady?'paywait':'wait');
  let payButton='';
  if(paid){
    payButton=`<button class="full green" disabled>정산 완료</button>`;
  }else if(workerConfirmed){
    payButton=`<button class="full green" onclick="markWorkerPaid(${a.id})">정산 완료</button>`;
  }else if(cashChecking){
    payButton=`<div class="settle-note">현장관리자 지급 확인 완료.<br>근로자 수령 확인 후 MASTER 정산완료가 가능합니다.</div>`;
  }else if(status==='근무완료'||status==='입금대기'){
    payButton=`<div class="settle-note">현장관리자 지급 확인 → 근로자 수령 확인 후 정산완료 처리할 수 있습니다.</div>`;
  }else{
    payButton=`<div class="mini">현장관리자 근무완료 체크 후 정산 절차가 시작됩니다.</div>`;
  }

  return `<div class="card" style="margin:10px 0;background:rgba(15,23,42,.72)">
    <span class="status ${paymentClass}">${paymentText}</span>
    ${settlementBadge(status)}
    <div class="worker-card-title" style="margin-top:10px">${esc(a.worker_name||'이름없음')}</div>
    <div class="meta">연락처: ${esc(a.phone||'번호없음')}<br>근무상태: ${esc(status)}<br><br><b>현장 정보</b><br>업체명: ${esc(job?job.title:'삭제된 공고')} · 관리자 연락처: ${esc(getManagerContact(job))}<br>현장 위치: ${esc(job?job.location:'-')}<br>근무시간: ${esc(job?job.work_time:'-')}<br>업체 일당: ${job?won(job.salary):'-'}<br>Crew 수수료(5%): ${job?won(feeAmount(job.salary)):'-'}<br>총 결제금액: ${job?won(totalPayment(job.salary)):'-'}<br>작업: ${esc(job?jobType(job):'-')}<br>출근: ${getAttendanceStatus(a)}<br><br><b>계좌 정보</b><br>${getBankInfo(a)}</div>
    ${payButton}
  </div>`
}
function getBankInfo(a){
  const saved=getWorkerAccounts().find(w=>normalizePhone(w.phone)===normalizePhone(a.phone));
  const bank=a.bank_name||a.bank||a.account_bank||(saved&&saved.bank)||'';
  const number=a.account_number||a.account||a.bank_account||(saved&&saved.account)||'';
  const holder=a.account_holder||a.holder||(saved&&saved.holder)||a.worker_name||'';
  if(!bank&&!number)return '계좌 없음 · 현장 지급/수령 확인 필요';
  return `${bank?esc(bank)+' ':''}${number?esc(number)+' ':''}${holder?'/ '+esc(holder):''}`
}
function getManagerContact(job){
  if(!job)return '미등록';
  const account=getManagerAccounts().find(a=>String(a.company_id||'')===String(job.company_id||''));
  const contacts={demo_company:'미등록',alpha:'미등록',beta:'미등록'};
  return job.manager_phone||job.manager_contact||job.contact_phone||job.phone||(account&&account.phone)||contacts[job.company_id]||'미등록'
}
function getAttendanceStatus(a){const found=attendance.find(t=>String(t.phone||'')===String(a.phone||'')&&String(t.job_id||'')===String(a.job_id||''));return found?'출근기록 있음':'출근기록 없음'}
async function setJobStatus(id,status){
  const job=jobs.find(j=>Number(j.id)===Number(id));
  if(!job)return alert('공고를 찾을 수 없습니다.');
  const current=jobStatus(job);
  if(current==='공고마감')return alert('공고마감 상태입니다. 먼저 마감해제를 눌러주세요.');
  if(isJobFull(job))return alert('필요 인원이 꽉 차서 상태를 변경할 수 없습니다.');

  if(status==='입금확인'){
    if(current!=='입금대기')return alert('입금전 상태에서만 입금완료 처리할 수 있습니다.');
  }
  if(status==='게시중'){
    if(current!=='입금확인')return alert('입금완료 후 게시승인할 수 있습니다.');
  }
  if(status==='공고마감'){
    if(!confirm('이 공고를 마감할까요?'))return;
  }

  const nextType=status==='공고마감'?makeClosedType(current,jobType(job)):makeType(status,jobType(job));
  const {error}=await db.from('jobs').update({type:nextType}).eq('id',id);
  if(error){alert('공고 상태 변경 오류: '+error.message);return}
  await loadMasterData();
  alert(statusText(status)+' 처리 완료');
}

async function markWorkerPaid(id){
  const app=applications.find(a=>Number(a.id)===Number(id));
  if(!app)return alert('근로자 정보를 찾을 수 없습니다.');
  const status=String(app.status||'지원').trim();
  if(status!=='수령확인완료'){
    return alert('관리자 지급 확인과 근로자 수령 확인이 모두 완료되어야 정산완료 처리할 수 있습니다.');
  }
  if(!confirm('이 근로자를 정산 완료 처리할까요?'))return;
  const {error}=await db.from('applications').update({status:'입금완료'}).eq('id',id);
  if(error){alert('입금 완료 처리 오류: '+error.message);return}
  await loadMasterData();
  alert('정산 완료 처리됨');
}
async function deleteJob(id){if(!confirm('이 공고를 삭제할까요?'))return;const {error}=await db.from('jobs').delete().eq('id',id);if(error){alert('삭제 오류: '+error.message);return}await loadMasterData()}
</script>
